services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redhood_test
      POSTGRES_USER: redhood
      POSTGRES_PASSWORD: redhood-local-only
    ports: ["127.0.0.1::5432"]
    volumes: ["/var/lib/postgresql/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U redhood -d redhood_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
