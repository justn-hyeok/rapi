services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redhood
      POSTGRES_USER: redhood
      POSTGRES_PASSWORD: redhood-local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - redhood-postgres:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U redhood -d redhood"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redhood-postgres:
